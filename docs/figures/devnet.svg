<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" font-family="Helvetica, Arial, sans-serif">
  <title>The Docker devnet: four validators, an explorer and optional monitoring on one machine</title>
  <desc>python scripts/devnet.py up generates networks/devnet (validator keys, genesis, docker-compose.yml), builds one image from docker/Dockerfile and starts four validator containers, baker0 to baker3. Each has its own data volume holding the chain and its signing journal, and connects to the three others over peer-to-peer on the compose network. Heimdall, the explorer, indexes the chain from the RPC of baker0. With --monitoring, Prometheus scrapes the metrics of every validator and of Heimdall and loads the alert rules, and Grafana shows the dashboard Kern Devnet consensus. Every port is published on 127.0.0.1 only. The commands status and check read every validator and compare their blocks level by level. Stopping one validator leaves the others producing blocks; stopping half the stake stops the chain without a fork; restarting them lets them catch up. No measured number appears in the figure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/></marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8642c"/></marker>
    <marker id="arrow-no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b03a2e"/></marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d4f"/></marker>
  </defs>
