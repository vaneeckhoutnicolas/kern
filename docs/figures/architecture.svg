<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" font-family="Helvetica, Arial, sans-serif">
  <title>Kern at a glance: a narrow base layer, each part one job</title>
  <desc>The Kern layer 1 does four jobs: settle (blocks finalized by BFT consensus with a Tendermint lock), govern (dual-track on-chain governance), attest (slashable, schema-indexed attestations) and register (Skald contracts whose declared invariants the runtime re-checks after every entry call). Validators secure it with bonded Proof-of-Stake: the protocol holds the bond, never the validator. General execution is pushed out to optimistic EVM rollups that post state commitments to the layer 1 and are challenged by bisection down to one instruction. Around it, the Heimdall explorer, Prometheus metrics and a one-command Docker devnet make the chain observable. A legend separates what is implemented and tested from what is a design target or not built yet. No measured number appears in the figure.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8794"/></marker>
    <marker id="arrow-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a8642c"/></marker>
    <marker id="arrow-no" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b03a2e"/></marker>
    <marker id="arrow-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2f7d4f"/></marker>
  </defs>
  <rect width="960" height="660" fill="#ffffff"/>
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1f2933" text-anchor="middle">Kern: a narrow base layer, each part one job</text>
  <text x="480" y="58" font-size="13" font-weight="normal" fill="#52606d" text-anchor="middle">settle, govern, attest, register; general execution is pushed out to rollups</text>
  <rect x="30" y="110" width="220" height="150" rx="6" fill="#eef4fa" stroke="#2f5f8f" stroke-width="1"/>
  <text x="140.0" y="132" font-size="14" font-weight="bold" fill="#2f5f8f" text-anchor="middle">Validators</text>
  <text x="140.0" y="152" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">bonded Proof-of-Stake:</text>
  <text x="140.0" y="168" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">the protocol holds the bond,</text>
  <text x="140.0" y="184" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">never the validator</text>
  <text x="140.0" y="200" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">slashed for conflicting votes</text>
  <text x="140.0" y="216" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">signing journal on disk</text>
  <line x1="250" y1="185" x2="300" y2="185" stroke="#2f5f8f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="275" y="176" font-size="11" font-weight="normal" fill="#2f5f8f" text-anchor="middle">votes</text>
  <rect x="300" y="90" width="400" height="330" rx="6" fill="#fbf3ec" stroke="#a8642c" stroke-width="1.6"/>
  <text x="500" y="116" font-size="16" font-weight="bold" fill="#a8642c" text-anchor="middle">Kern layer 1</text>
  <text x="500" y="135" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">the settlement and registry layer</text>
  <rect x="316" y="152" width="176" height="114" rx="6" fill="#ffffff" stroke="#a8642c" stroke-width="1"/>
  <text x="404.0" y="174" font-size="14" font-weight="bold" fill="#a8642c" text-anchor="middle">Settle</text>
  <text x="404.0" y="194" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">BFT consensus with a</text>
  <text x="404.0" y="210" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Tendermint lock: a block,</text>
  <text x="404.0" y="226" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">once final, stays final</text>
  <rect x="508" y="152" width="176" height="114" rx="6" fill="#ffffff" stroke="#a8642c" stroke-width="1"/>
  <text x="596.0" y="174" font-size="14" font-weight="bold" fill="#a8642c" text-anchor="middle">Govern</text>
  <text x="596.0" y="194" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">dual-track on-chain</text>
  <text x="596.0" y="210" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">governance: protocol</text>
  <text x="596.0" y="226" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">amendments, treasury</text>
  <rect x="316" y="282" width="176" height="114" rx="6" fill="#ffffff" stroke="#a8642c" stroke-width="1"/>
  <text x="404.0" y="304" font-size="14" font-weight="bold" fill="#a8642c" text-anchor="middle">Attest</text>
  <text x="404.0" y="324" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">slashable attestations,</text>
  <text x="404.0" y="340" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">schema-indexed, bonded</text>
  <text x="404.0" y="356" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">by their issuer</text>
  <rect x="508" y="282" width="176" height="114" rx="6" fill="#ffffff" stroke="#a8642c" stroke-width="1"/>
  <text x="596.0" y="304" font-size="14" font-weight="bold" fill="#a8642c" text-anchor="middle">Register</text>
  <text x="596.0" y="324" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">Skald contracts: declared</text>
  <text x="596.0" y="340" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">invariants re-checked</text>
  <text x="596.0" y="356" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">after every entry call</text>
  <rect x="780" y="110" width="160" height="170" rx="6" fill="#fafafa" stroke="#7b8794" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="860.0" y="132" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">EVM rollups</text>
  <text x="860.0" y="152" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">optimistic, Mini-EVM</text>
  <text x="860.0" y="168" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">execution happens here</text>
  <text x="860.0" y="184" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">state commitments to L1</text>
  <text x="860.0" y="200" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">challenged by bisection</text>
  <text x="860.0" y="216" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">to one instruction</text>
  <line x1="778" y1="175" x2="702" y2="175" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="740" y="166" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">commit</text>
  <line x1="702" y1="225" x2="778" y2="225" stroke="#7b8794" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="740" y="216" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">challenge</text>
  <text x="860" y="300" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle" font-style="italic">rollup operations are</text>
  <text x="860" y="315" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle" font-style="italic">not yet L1 transactions</text>
  <rect x="30" y="300" width="220" height="120" rx="6" fill="#f5f7fa" stroke="#7b8794" stroke-width="1"/>
  <text x="140.0" y="322" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="middle">KRN token</text>
  <text x="140.0" y="342" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">fees, staking collateral,</text>
  <text x="140.0" y="358" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">governance weight,</text>
  <text x="140.0" y="374" font-size="12" font-weight="normal" fill="#52606d" text-anchor="middle">storage rent, treasury share</text>
  <line x1="250" y1="360" x2="300" y2="360" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="30" y="460" width="900" height="120" rx="6" fill="#eef1f5" stroke="#7b8794" stroke-width="1"/>
  <text x="48" y="484" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">Observable</text>
  <rect x="48" y="496" width="204" height="72" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1"/>
  <text x="150.0" y="518" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Heimdall explorer</text>
  <text x="150.0" y="537" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">blocks, accounts, contracts,</text>
  <text x="150.0" y="552" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">attestations, governance</text>
  <rect x="268" y="496" width="204" height="72" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1"/>
  <text x="370.0" y="518" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Prometheus and Grafana</text>
  <text x="370.0" y="537" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">round, timeouts, peers,</text>
  <text x="370.0" y="552" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">height spread, evidence</text>
  <rect x="488" y="496" width="204" height="72" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1"/>
  <text x="590.0" y="518" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">Docker devnet</text>
  <text x="590.0" y="537" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">python scripts/devnet.py up:</text>
  <text x="590.0" y="552" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">validators in containers</text>
  <rect x="708" y="496" width="204" height="72" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1"/>
  <text x="810.0" y="518" font-size="13" font-weight="bold" fill="#1f2933" text-anchor="middle">check</text>
  <text x="810.0" y="537" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">same block at every level</text>
  <text x="810.0" y="552" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">on every validator</text>
  <line x1="500" y1="420" x2="500" y2="458" stroke="#7b8794" stroke-width="1.4" marker-end="url(#arrow)"/>
  <text x="510" y="444" font-size="11" font-weight="normal" fill="#52606d" text-anchor="start">RPC and /metrics</text>
  <rect x="48" y="609" width="16" height="12" rx="2" fill="#fbf3ec" stroke="#a8642c" stroke-width="1"/>
  <text x="70" y="620" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">implemented and tested</text>
  <rect x="278" y="609" width="16" height="12" rx="2" fill="#eef4fa" stroke="#2f5f8f" stroke-width="1"/>
  <text x="300" y="620" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">who secures the chain</text>
  <rect x="508" y="609" width="16" height="12" rx="2" fill="#fafafa" stroke="#7b8794" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="530" y="620" font-size="12" font-weight="normal" fill="#52606d" text-anchor="start">partly built (see note)</text>
  <text x="930" y="620" font-size="11" font-weight="normal" fill="#52606d" text-anchor="end" font-style="italic">pre-audit; not yet run by independent operators</text>
</svg>
