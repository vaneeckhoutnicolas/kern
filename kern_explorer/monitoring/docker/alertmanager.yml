# Sample AlertManager configuration.
#
# This sample uses a webhook receiver that prints alerts to stdout — good for
# devnet / local testing, useless for production. Replace receivers with your
# real channels before deploying to Yggdrasil or Midgard.
#
# Production deployments typically use:
#   - Slack: https://prometheus.io/docs/alerting/latest/configuration/#slack_config
#   - PagerDuty: https://prometheus.io/docs/alerting/latest/configuration/#pagerduty_config
#   - OpsGenie: https://prometheus.io/docs/alerting/latest/configuration/#opsgenie_config
#   - Email: https://prometheus.io/docs/alerting/latest/configuration/#email_config
#
# Route by severity + vertical (labels emitted by kern-alerts.yml):
#   severity in (critical, warning, info)
#   vertical in (l1, attestations, oracles, sto, heimdall)
#   team     in (validators, foundation, ops, oracle-ops)

global:
  resolve_timeout: 5m

# Tree of routes — first matching child wins; bubble up to parent otherwise.
route:
  receiver: default
  group_by: ['alertname', 'vertical']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Critical L1 alerts → page validators immediately, no grouping delay
    - matchers:
        - severity = critical
        - vertical = l1
      receiver: validators_pager
      group_wait: 0s
      repeat_interval: 30m

    # STO compliance alerts → Foundation channel, page on critical
    - matchers:
        - vertical = sto
      receiver: foundation_compliance
      group_wait: 30s

    # Oracle circuit breaker → oracle-ops, immediate
    - matchers:
        - vertical = oracles
        - severity = critical
      receiver: oracle_ops_pager
      group_wait: 0s

# Receivers — REPLACE these with real endpoints before production.
receivers:
  - name: default
    webhook_configs:
      - url: 'http://127.0.0.1:5001/'
        send_resolved: true

  - name: validators_pager
    webhook_configs:
      - url: 'http://127.0.0.1:5001/validators'
        send_resolved: true
    # Example PagerDuty config (uncomment and set integration key):
    # pagerduty_configs:
    #   - service_key: 'REPLACE_WITH_PAGERDUTY_KEY'

  - name: foundation_compliance
    webhook_configs:
      - url: 'http://127.0.0.1:5001/compliance'
        send_resolved: true
    # Example Slack config:
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/REPLACE/WITH/REAL'
    #     channel: '#kern-compliance'
    #     title: '{{ .CommonAnnotations.summary }}'
    #     text: '{{ .CommonAnnotations.description }}'

  - name: oracle_ops_pager
    webhook_configs:
      - url: 'http://127.0.0.1:5001/oracles'
        send_resolved: true

# Inhibition rules — suppress lower-severity alerts when a higher-severity
# alert for the same component is already firing.
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'vertical']
