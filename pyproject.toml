[project]
name = "kern"
version = "1.1.0rc2"
description = "Kern — a Layer-1 blockchain protocol. Reference implementation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kern contributors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pynacl>=1.6.2",
    "aiohttp>=3.14.1",
    "py_ecc>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",                    # used by the FastAPI TestClient too
    "pyyaml>=6.0.3",                      # used by the Heimdall alert-rule tests
    "fastapi>=0.138.0",                 # Heimdall explorer tests import the app
    "uvicorn[standard]>=0.49.0",
    "jinja2>=3.1.6",
]
explorer = [
    "fastapi>=0.138.0",
    "uvicorn[standard]>=0.49.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "pymdown-extensions>=10.21.3",
]

[project.scripts]
kern-node = "kern.node:main"
heimdall = "kern_explorer.app:main"

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kern*", "kern_explorer*"]

[tool.setuptools.package-data]
kern_explorer = [
    "templates/*.html",
    "static/*",
    "monitoring/grafana/*.json",
    "monitoring/alerts/*.yml",
    "monitoring/docker/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
