[project]
name = "kern"
version = "1.1.0rc2"
description = "Kern — a Layer-1 blockchain protocol. Reference implementation."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kern contributors" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "pynacl>=1.5.0",
    "aiohttp>=3.9.0",
    "py_ecc>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",                    # used by the FastAPI TestClient too
    "pyyaml>=6.0",                      # used by the Heimdall alert-rule tests
    "fastapi>=0.136.3",                 # Heimdall explorer tests import the app
    "uvicorn[standard]>=0.48.0",
    "jinja2>=3.1.6",
]
explorer = [
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.6",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.7.6",
    "pymdown-extensions>=10.0",
]

[project.scripts]
kern-node = "kern.node:main"
heimdall = "kern_explorer.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kern*", "kern_explorer*"]

[tool.setuptools.package-data]
kern_explorer = [
    "templates/*.html",
    "static/*",
    "monitoring/grafana/*.json",
    "monitoring/alerts/*.yml",
    "monitoring/docker/*.yml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
